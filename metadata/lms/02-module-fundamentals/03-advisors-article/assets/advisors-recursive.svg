<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 1400" font-family="'Helvetica Neue', Arial, sans-serif">
  <defs>
    <marker id="g" markerWidth="10" markerHeight="10" refX="7" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M0.5,0.5 L8,4 L0.5,7.5" fill="none" stroke="#7a8896" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="920" height="1400" fill="#ffffff"/>

  <!-- ===== Repeatable region ===== -->
  <rect x="120" y="330" width="680" height="1010" rx="28" fill="#ffffff" stroke="#2b6a8f" stroke-width="3" stroke-dasharray="12 9"/>
  <text x="85" y="835" text-anchor="middle" font-size="32" font-style="italic" font-weight="700" fill="#2b6a8f" transform="rotate(-90 85 835)">Repeatable</text>

  <!-- ===== connectors between the advisors ===== -->
  <g stroke="#7a8896" stroke-width="4" fill="none">
    <!-- request lane, downwards -->
    <path d="M300,80 V152" marker-end="url(#g)"/>
    <path d="M300,270 V400"/>
    <path d="M300,760 V832" marker-end="url(#g)"/>
    <path d="M300,950 V1160 H374" marker-end="url(#g)"/>
    <!-- response lane, upwards -->
    <path d="M546,1160 H620 V958" marker-end="url(#g)"/>
    <path d="M620,840 V760"/>
    <path d="M620,400 V278" marker-end="url(#g)"/>
    <path d="M620,152 V80" marker-end="url(#g)"/>
  </g>

  <!-- ===== lane labels ===== -->
  <g text-anchor="middle" font-size="26" fill="#1c3d5a">
    <text x="300" y="60">ChatClientRequest</text>
    <text x="620" y="60">ChatClientResponse</text>
  </g>

  <!-- ===== ellipsis between advisors ===== -->
  <g fill="#9aa4ad">
    <circle cx="424" cy="300" r="5"/><circle cx="442" cy="300" r="5"/><circle cx="460" cy="300" r="5"/><circle cx="478" cy="300" r="5"/>
    <circle cx="424" cy="1010" r="5"/><circle cx="442" cy="1010" r="5"/><circle cx="460" cy="1010" r="5"/><circle cx="478" cy="1010" r="5"/>
  </g>

  <!-- ===== Advisor ABC ===== -->
  <rect x="200" y="160" width="520" height="110" rx="18" fill="#ffffff" stroke="#237e7a" stroke-width="4"/>
  <text x="460" y="228" text-anchor="middle" font-size="34" fill="#1c3d5a">Advisor ABC</text>

  <!-- ===== Advisor XYZ ===== -->
  <rect x="200" y="840" width="520" height="110" rx="18" fill="#ffffff" stroke="#237e7a" stroke-width="4"/>
  <text x="460" y="908" text-anchor="middle" font-size="34" fill="#1c3d5a">Advisor XYZ</text>

  <!-- ===== Recursive Advisor ===== -->
  <rect x="200" y="400" width="520" height="360" rx="20" fill="#ffffff" stroke="#237e7a" stroke-width="4"/>
  <text x="460" y="456" text-anchor="middle" font-size="32" font-weight="700" fill="#237e7a">Recursive Advisor</text>

  <!-- connectors inside the recursive advisor -->
  <g stroke="#7a8896" stroke-width="4" fill="none">
    <path d="M300,400 V630" marker-end="url(#g)"/>              <!-- request into the before step -->
    <path d="M620,760 V728" marker-end="url(#g)"/>              <!-- response into the after step -->
    <path d="M620,640 V578" marker-end="url(#g)"/>              <!-- after step into the decision -->
    <path d="M620,490 V400"/>                                   <!-- decision out of the chain -->
    <path d="M548,530 C470,540 350,556 340,630" marker-end="url(#g)"/>  <!-- loop back -->
  </g>

  <!-- decision diamond -->
  <path d="M550,530 L620,490 L690,530 L620,570 Z" fill="#ffffff" stroke="#2b6a8f" stroke-width="3.5" stroke-linejoin="round"/>
  <text x="620" y="544" text-anchor="middle" font-size="34" fill="#1c3d5a">?</text>

  <!-- before / after steps -->
  <rect x="220" y="640" width="160" height="80" rx="10" fill="#ffffff" stroke="#2b6a8f" stroke-width="3"/>
  <text x="300" y="690" text-anchor="middle" font-size="30" fill="#1c3d5a">Before</text>
  <rect x="540" y="640" width="160" height="80" rx="10" fill="#ffffff" stroke="#2b6a8f" stroke-width="3"/>
  <text x="620" y="690" text-anchor="middle" font-size="30" fill="#1c3d5a">After</text>

  <!-- ===== Chat Model neural net ===== -->
  <g stroke="#1c3d5a" stroke-width="2" fill="none">
    <line x1="400" y1="1130" x2="460" y2="1103"/><line x1="400" y1="1130" x2="460" y2="1160"/><line x1="400" y1="1130" x2="460" y2="1217"/>
    <line x1="400" y1="1190" x2="460" y2="1103"/><line x1="400" y1="1190" x2="460" y2="1160"/><line x1="400" y1="1190" x2="460" y2="1217"/>
    <line x1="460" y1="1103" x2="522" y2="1160"/><line x1="460" y1="1160" x2="522" y2="1160"/><line x1="460" y1="1217" x2="522" y2="1160"/>
  </g>
  <g fill="#ffffff" stroke="#1c3d5a" stroke-width="2.5">
    <circle cx="400" cy="1130" r="12"/><circle cx="400" cy="1190" r="12"/>
    <circle cx="460" cy="1103" r="12"/><circle cx="460" cy="1160" r="12"/><circle cx="460" cy="1217" r="12"/>
    <circle cx="522" cy="1160" r="12"/>
  </g>
  <text x="461" y="1290" text-anchor="middle" font-size="34" fill="#1c3d5a">Chat Model</text>
</svg>
