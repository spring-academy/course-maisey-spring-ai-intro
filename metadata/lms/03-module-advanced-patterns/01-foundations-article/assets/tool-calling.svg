<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1180" font-family="'Helvetica Neue', Arial, sans-serif">
  <defs>
    <marker id="g" markerWidth="10" markerHeight="10" refX="7" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M0.5,0.5 L8,4 L0.5,7.5" fill="none" stroke="#7a8896" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1200" height="1180" fill="#ffffff"/>

  <!-- Tool Calling process label -->
  <text x="600" y="175" text-anchor="middle" font-style="italic" font-size="34" fill="#9aa4ad">Tool Calling process</text>

  <!-- APPLICATION container -->
  <rect x="40" y="200" width="1120" height="600" rx="34" fill="#f6f8fa" stroke="#e2e8ee" stroke-width="2"/>
  <text x="600" y="272" text-anchor="middle" font-size="42" font-weight="800" fill="#1c3d5a">APPLICATION</text>

  <!-- ===== connectors (behind) ===== -->
  <!-- solid -->
  <g stroke="#7a8896" stroke-width="4" fill="none">
    <path d="M230,140 V500" marker-end="url(#g)"/>                     <!-- query -> chat request -->
    <path d="M410,662 H500 V960 H572" marker-end="url(#g)"/>           <!-- chat request -> llm -->
    <path d="M712,960 H822 V616 H876" marker-end="url(#g)"/>           <!-- llm -> response -->
  </g>
  <!-- dashed -->
  <g stroke="#7a8896" stroke-width="4" fill="none" stroke-dasharray="11 9">
    <path d="M650,905 V656" marker-end="url(#g)"/>                     <!-- llm -> tool call request -->
    <path d="M650,558 V504" marker-end="url(#g)"/>                     <!-- tool call request -> tool -->
    <path d="M772,500 V905 H726" marker-end="url(#g)"/>                <!-- tool -> llm -->
  </g>
  <!-- tool definition detail line -->
  <path d="M245,700 V838" stroke="#1c3d5a" stroke-width="2.5" fill="none"/>

  <!-- ===== Query speech bubble ===== -->
  <path d="M166,132 L220,132 L174,170 Z" fill="#ffffff" stroke="#2b6a8f" stroke-width="4" stroke-linejoin="round"/>
  <rect x="130" y="46" width="200" height="90" rx="45" fill="#ffffff" stroke="#2b6a8f" stroke-width="4"/>
  <text x="230" y="102" text-anchor="middle" font-size="32" fill="#1c3d5a">Query</text>

  <!-- ===== Chat Request ===== -->
  <rect x="80" y="500" width="330" height="252" rx="20" fill="#ffffff" stroke="#237e7a" stroke-width="4"/>
  <text x="102" y="552" font-size="34" font-weight="700" fill="#237e7a">Chat Request</text>
  <rect x="110" y="566" width="270" height="62" rx="8" fill="#ffffff" stroke="#1c3d5a" stroke-width="2.5"/>
  <text x="245" y="606" text-anchor="middle" font-size="30" fill="#1c3d5a">Prompt</text>
  <rect x="110" y="644" width="270" height="62" rx="8" fill="#ffffff" stroke="#237e7a" stroke-width="2.5" stroke-dasharray="9 7"/>
  <text x="245" y="684" text-anchor="middle" font-size="30" fill="#1c3d5a">Tool Definition</text>

  <!-- tool definition detail text -->
  <g text-anchor="middle" font-size="30" fill="#1c3d5a">
    <text x="245" y="872">name</text>
    <text x="245" y="912">description</text>
    <text x="245" y="952">input schema</text>
  </g>

  <!-- ===== Tool (dashed) ===== -->
  <rect x="480" y="432" width="340" height="70" rx="12" fill="#ffffff" stroke="#2b6a8f" stroke-width="3" stroke-dasharray="11 8"/>
  <text x="650" y="477" text-anchor="middle" font-size="30" fill="#1c3d5a">Tool</text>

  <!-- ===== Tool Call Request (dashed) ===== -->
  <rect x="535" y="562" width="230" height="94" rx="12" fill="#ffffff" stroke="#2b6a8f" stroke-width="3" stroke-dasharray="11 8"/>
  <text x="650" y="600" text-anchor="middle" font-size="29" fill="#1c3d5a">Tool Call</text>
  <text x="650" y="634" text-anchor="middle" font-size="29" fill="#1c3d5a">Request</text>

  <!-- ===== Response (purple) ===== -->
  <rect x="880" y="580" width="220" height="74" rx="14" fill="#ffffff" stroke="#6b3fa0" stroke-width="4"/>
  <text x="990" y="626" text-anchor="middle" font-size="30" fill="#1c3d5a">Response</text>

  <!-- ===== LLM neural net ===== -->
  <g stroke="#1c3d5a" stroke-width="2" fill="none">
    <line x1="590" y1="930" x2="650" y2="905"/><line x1="590" y1="930" x2="650" y2="960"/><line x1="590" y1="930" x2="650" y2="1015"/>
    <line x1="590" y1="990" x2="650" y2="905"/><line x1="590" y1="990" x2="650" y2="960"/><line x1="590" y1="990" x2="650" y2="1015"/>
    <line x1="650" y1="905" x2="712" y2="960"/><line x1="650" y1="960" x2="712" y2="960"/><line x1="650" y1="1015" x2="712" y2="960"/>
  </g>
  <g fill="#ffffff" stroke="#1c3d5a" stroke-width="2.5">
    <circle cx="590" cy="930" r="12"/><circle cx="590" cy="990" r="12"/>
    <circle cx="650" cy="905" r="12"/><circle cx="650" cy="960" r="12"/><circle cx="650" cy="1015" r="12"/>
    <circle cx="712" cy="960" r="12"/>
  </g>
  <text x="651" y="1090" text-anchor="middle" font-size="32" fill="#1c3d5a">LLM</text>
</svg>
