<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 1060" font-family="'Helvetica Neue', Arial, sans-serif">
  <defs>
    <marker id="g" markerWidth="10" markerHeight="10" refX="7" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M0.5,0.5 L8,4 L0.5,7.5" fill="none" stroke="#7a8896" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1400" height="1060" fill="#ffffff"/>

  <!-- step labels -->
  <g font-style="italic" font-weight="700" font-size="36" fill="#6aa84f">
    <text x="720" y="70">1. Retrieve</text>
    <text x="70" y="400">2. Augment</text>
    <text x="250" y="835">3. Generate</text>
  </g>

  <!-- ===== connectors (behind) ===== -->
  <g stroke="#7a8896" stroke-width="4" fill="none">
    <!-- query -> embedding -->
    <line x1="266" y1="170" x2="470" y2="170" marker-end="url(#g)"/>
    <!-- embedding -> vector db -->
    <line x1="650" y1="170" x2="792" y2="170" marker-end="url(#g)"/>
    <!-- vector db -> context -->
    <line x1="928" y1="170" x2="1074" y2="170" marker-end="url(#g)"/>
    <!-- query branch down into prompt query -->
    <path d="M360,170 V530 H333" marker-end="url(#g)"/>
    <!-- context branch down into prompt context -->
    <path d="M1190,214 V636 H333" marker-end="url(#g)"/>
    <!-- prompt -> llm -->
    <path d="M210,724 V884 H556" marker-end="url(#g)"/>
    <!-- llm -> response -->
    <line x1="688" y1="884" x2="1072" y2="884" marker-end="url(#g)"/>
  </g>
  <circle cx="360" cy="170" r="5" fill="#7a8896"/>

  <!-- ===== Query speech bubble ===== -->
  <path d="M96,214 L150,214 L104,252 Z" fill="#ffffff" stroke="#2b6a8f" stroke-width="4" stroke-linejoin="round"/>
  <rect x="60" y="122" width="206" height="96" rx="48" fill="#ffffff" stroke="#2b6a8f" stroke-width="4"/>
  <text x="163" y="182" text-anchor="middle" font-size="34" fill="#1c3d5a">Query</text>

  <!-- ===== Embedding Model neural net ===== -->
  <g stroke="#1c3d5a" stroke-width="2" fill="none">
    <line x1="505" y1="140" x2="560" y2="118"/><line x1="505" y1="140" x2="560" y2="170"/><line x1="505" y1="140" x2="560" y2="222"/>
    <line x1="505" y1="200" x2="560" y2="118"/><line x1="505" y1="200" x2="560" y2="170"/><line x1="505" y1="200" x2="560" y2="222"/>
    <line x1="560" y1="118" x2="617" y2="170"/><line x1="560" y1="170" x2="617" y2="170"/><line x1="560" y1="222" x2="617" y2="170"/>
  </g>
  <g fill="#ffffff" stroke="#1c3d5a" stroke-width="2.5">
    <circle cx="505" cy="140" r="11"/><circle cx="505" cy="200" r="11"/>
    <circle cx="560" cy="118" r="11"/><circle cx="560" cy="170" r="11"/><circle cx="560" cy="222" r="11"/>
    <circle cx="617" cy="170" r="11"/>
  </g>
  <g text-anchor="middle" font-size="30" fill="#1c3d5a">
    <text x="561" y="300">Embedding</text><text x="561" y="336">Model</text>
  </g>

  <!-- ===== Vector DB cylinder ===== -->
  <path d="M800,118 V222 A60,18 0 0 0 920,222 V118" fill="#ffffff" stroke="#1c3d5a" stroke-width="4"/>
  <ellipse cx="860" cy="118" rx="60" ry="18" fill="#ffffff" stroke="#1c3d5a" stroke-width="4"/>
  <g fill="#1c3d5a"><circle cx="896" cy="150" r="4"/><circle cx="896" cy="175" r="4"/><circle cx="896" cy="200" r="4"/></g>
  <text x="860" y="300" text-anchor="middle" font-size="30" fill="#1c3d5a">Vector DB</text>

  <!-- ===== Context (dashed) top ===== -->
  <rect x="1080" y="130" width="220" height="80" rx="12" fill="#ffffff" stroke="#1c3d5a" stroke-width="3" stroke-dasharray="10 8"/>
  <text x="1190" y="180" text-anchor="middle" font-size="30" fill="#1c3d5a">Context</text>

  <!-- ===== Prompt box (Augment) ===== -->
  <rect x="70" y="430" width="290" height="294" rx="20" fill="#ffffff" stroke="#237e7a" stroke-width="4"/>
  <text x="120" y="482" font-size="34" font-weight="700" fill="#237e7a">Prompt</text>
  <rect x="100" y="498" width="230" height="70" rx="8" fill="#ffffff" stroke="#1c3d5a" stroke-width="2.5"/>
  <text x="215" y="542" text-anchor="middle" font-size="30" fill="#1c3d5a">Query</text>
  <rect x="100" y="600" width="230" height="70" rx="8" fill="#ffffff" stroke="#237e7a" stroke-width="2.5" stroke-dasharray="9 7"/>
  <text x="215" y="644" text-anchor="middle" font-size="30" fill="#1c3d5a">Context</text>

  <!-- ===== LLM neural net ===== -->
  <g stroke="#1c3d5a" stroke-width="2" fill="none">
    <line x1="565" y1="854" x2="620" y2="832"/><line x1="565" y1="854" x2="620" y2="884"/><line x1="565" y1="854" x2="620" y2="936"/>
    <line x1="565" y1="914" x2="620" y2="832"/><line x1="565" y1="914" x2="620" y2="884"/><line x1="565" y1="914" x2="620" y2="936"/>
    <line x1="620" y1="832" x2="677" y2="884"/><line x1="620" y1="884" x2="677" y2="884"/><line x1="620" y1="936" x2="677" y2="884"/>
  </g>
  <g fill="#ffffff" stroke="#1c3d5a" stroke-width="2.5">
    <circle cx="565" cy="854" r="11"/><circle cx="565" cy="914" r="11"/>
    <circle cx="620" cy="832" r="11"/><circle cx="620" cy="884" r="11"/><circle cx="620" cy="936" r="11"/>
    <circle cx="677" cy="884" r="11"/>
  </g>
  <text x="621" y="1000" text-anchor="middle" font-size="30" fill="#1c3d5a">LLM</text>

  <!-- ===== Response ===== -->
  <rect x="1080" y="844" width="220" height="80" rx="14" fill="#ffffff" stroke="#6b3fa0" stroke-width="4"/>
  <text x="1190" y="894" text-anchor="middle" font-size="30" fill="#1c3d5a">Response</text>
</svg>
