apiVersion: training.educates.dev/v1beta1
kind: Workshop
metadata:
  name: spring-maisey-observability
spec:
  title: Spring Academy - Spring AI - Observability
  description: "Add tracing and metrics to your Spring AI application using Micrometer"
  difficulty: beginner
  duration: 20m
  vendor: Broadcom
  workshop:
    image: jdk21-environment:*
    files:
      - http:
          url: "$(ingress_protocol)://$(assets_repository)/spring-maisey-observability.tar.gz"
  request:
    parameters:
    - name: USER_DOMAIN
      value: "unknown.domain"
    - name: USER_EMAIL
      value: "somebody@unknown.domain"
  session:
    namespaces:
      security:
        token:
          enabled: false
    env:
    - name: WEBSERVER
      value: "$(ingress_protocol)://$(assets_repository)"
    - name: BOOTSTRAP_COMMAND
      value: ":"
    resources:
      memory: 4Gi
    applications:
      terminal:
        enabled: true
        layout: split
      editor:
        enabled: true
      docker:
        enabled: true
        socket:
          enabled: true
    ingresses:
    - name: grafana
      port: 3000
    dashboards:
    - name: Grafana
      url: $(ingress_protocol)://grafana-$(session_name).$(ingress_domain)
  environment:
    assets:
      memory: 0Mi
      ingress:
        enabled: true
      files:
        - image:
            url: ${CONTAINER_REGISTRY}${CONTAINER_REPOSITORY}:${VERSION}
          newRootPath: usr/share/nginx/html