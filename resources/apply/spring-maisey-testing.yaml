apiVersion: training.educates.dev/v1beta1
kind: Workshop
metadata:
  name: spring-maisey-testing
spec:
  title: Spring Academy - Spring AI - Testing
  description: "Learn strategies for testing AI-powered applications using Spring AI evaluation API"
  difficulty: beginner
  duration: 20m
  vendor: Broadcom
  workshop:
    image: jdk21-environment:*
    files:
      - http:
          url: "$(ingress_protocol)://$(assets_repository)/spring-maisey-testing.tar.gz"
  request:
    parameters:
    - name: USER_DOMAIN
      value: "unknown.domain"
    - name: USER_EMAIL
      value: "somebody@unknown.domain"
  session:
    namespaces:
      security:
        token:
          enabled: false
    env:
    - name: WEBSERVER
      value: "$(ingress_protocol)://$(assets_repository)"
    - name: BOOTSTRAP_COMMAND
      value: ":"
    resources:
      memory: 4Gi
    applications:
      terminal:
        enabled: true
        layout: split
      editor:
        enabled: true
  environment:
    assets:
      memory: 0Mi
      ingress:
        enabled: true
      files:
        - image:
            url: ${CONTAINER_REGISTRY}${CONTAINER_REPOSITORY}:${VERSION}
          newRootPath: usr/share/nginx/html