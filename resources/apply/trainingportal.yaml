apiVersion: training.educates.dev/v1beta1
kind: TrainingPortal
metadata:
  name: spring-maisey
spec:
  portal:
    title: Spring Academy / Introduction to Spring AI
    updates:
      workshop: true
    sessions:
      maximum: 30
    theme:
      frame:
        ancestors:
        - https://spring.academy
        - https://*.spring.academy
        - https://*.vmware.com
        - https://*.broadcom.com
        - https://spring-staging.academy
        - https://spring-academy.broadcom.com
        - https://spring-academy-verify.broadcom.com
        - https://spring-academy-qa.broadcom.net
        - https://spring-academy-dev.broadcom.net
        - http://localhost:8080
  analytics:
    google:
      trackingId: "${ANALYTICS_GOOGLE_ID}"
    clarity:
      trackingId: "${ANALYTICS_CLARITY_ID}"
  workshops:
    - name: spring-maisey-fundamentals
      expires: 45m
      orphaned: 10m
      deadline: 90m
      overdue: 2m
      reserved: ${TRAINING_PORTAL_RESERVED}
    - name: spring-maisey-rag
      expires: 45m
      orphaned: 10m
      deadline: 90m
      overdue: 2m
      reserved: ${TRAINING_PORTAL_RESERVED}
    - name: spring-maisey-tool-calling
      expires: 40m
      orphaned: 10m
      deadline: 80m
      overdue: 2m
      reserved: ${TRAINING_PORTAL_RESERVED}
    - name: spring-maisey-mcp
      expires: 30m
      orphaned: 10m
      deadline: 60m
      overdue: 2m
      reserved: ${TRAINING_PORTAL_RESERVED}
    - name: spring-maisey-agentic-patterns
      expires: 40m
      orphaned: 10m
      deadline: 80m
      overdue: 2m
      reserved: ${TRAINING_PORTAL_RESERVED}
    - name: spring-maisey-observability
      expires: 30m
      orphaned: 10m
      deadline: 60m
      overdue: 2m
      reserved: ${TRAINING_PORTAL_RESERVED}
    - name: spring-maisey-testing
      expires: 30m
      orphaned: 10m
      deadline: 60m
      overdue: 2m
      reserved: ${TRAINING_PORTAL_RESERVED}

