apiVersion: training.educates.dev/v1beta1
kind: Workshop
metadata:
  name: spring-maisey-mcp
spec:
  title: Spring Academy - Spring AI - MCP Integration
  description: "Expose your Spring AI tools as a Model Context Protocol server and secure it with OAuth 2.0"
  difficulty: beginner
  duration: 35m
  vendor: Broadcom
  workshop:
    image: jdk21-environment:*
    files:
      - http:
          url: "$(ingress_protocol)://$(assets_repository)/spring-maisey-mcp.tar.gz"
  request:
    parameters:
    - name: USER_DOMAIN
      value: "unknown.domain"
    - name: USER_EMAIL
      value: "somebody@unknown.domain"
  session:
    namespaces:
      security:
        token:
          enabled: false
    env:
    - name: LAB_VERSION
      value: "${VERSION}"
    - name: WEBSERVER
      value: "$(ingress_protocol)://$(assets_repository)"
    - name: BOOTSTRAP_COMMAND
      value: ":"
    resources:
      memory: 4Gi
    applications:
      terminal:
        enabled: true
        layout: split/2
      editor:
        enabled: true
      docker:
        enabled: true
        socket:
          enabled: true
  environment:
    assets:
      memory: 0Mi
      ingress:
        enabled: true
      files:
        - image:
            url: ${CONTAINER_REGISTRY}${CONTAINER_REPOSITORY}:${VERSION}
          newRootPath: usr/share/nginx/html